<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>點點電子雞</title>
<style>
:root{--f:'Microsoft JhengHei','微軟正黑體','PingFang TC','Noto Sans TC',system-ui,sans-serif;--bg:#FFE9C7;--ink:#3A2A1C;--dim:#8A6E52;--shell:#FF8FB1;--shellD:#D9587F;--lcd:#CFE6B8;--line:#3A2A1C;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f)}
body{background:repeating-linear-gradient(45deg,#FFE9C7 0 14px,#FFE2B8 14px 28px);min-height:100vh;display:flex;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
a.home{color:var(--dim);font-size:15px;text-decoration:none;align-self:flex-start;font-weight:700}
h1{margin:4px 0 0;font-size:clamp(30px,8vw,42px);font-weight:900;letter-spacing:.06em;color:#E0457B;text-shadow:3px 3px 0 #3A2A1C;text-align:center}
.sub{margin:0;color:var(--dim);text-align:center;font-size:15px}
button{font-family:var(--f);font-weight:900;font-size:16px;color:#3A2A1C;background:#FFF7E8;border:3px solid var(--line);border-radius:4px;box-shadow:0 4px 0 var(--line);padding:8px 10px;cursor:pointer;line-height:1.15}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid #2F7BEA;outline-offset:2px}
button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--line)}
button.main{background:#FFD23F}
button.pink{background:#FF8FB1}
button.blue{background:#8FD3FF}
button.green{background:#A8E38A}

/* pet picker */
.grid20{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;font-size:14px;position:relative}
.pk canvas{width:56px;height:56px;image-rendering:pixelated}
.pk.on{background:#FFD23F}
.pk .tag{position:absolute;top:-8px;right:-6px;background:#2F7BEA;color:#fff;font-size:11px;padding:1px 5px;border-radius:3px;border:2px solid var(--line)}
.pk .tag.now{background:#E0457B}
.box{width:100%;background:#FFF7E8;border:3px solid var(--line);border-radius:6px;box-shadow:0 4px 0 var(--line);padding:12px 14px;font-size:15px;line-height:1.6}
.box h3{margin:0 0 6px;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=time]{font-family:var(--f);font-size:17px;font-weight:700;padding:6px 8px;border:3px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);min-width:0}
input[type=text]{flex:1}
input[type=time]{width:132px}

/* device */
.dev{width:100%;background:radial-gradient(ellipse at 30% 20%,#FFC1D4,var(--shell) 55%,var(--shellD));border:4px solid var(--line);border-radius:48% 48% 40% 40%/38% 38% 30% 30%;padding:30px 26px 22px;box-shadow:0 6px 0 var(--line),inset -10px -14px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.dev .holes{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dev .holes i{width:8px;height:8px;border-radius:50%;background:var(--shellD);border:2px solid var(--line)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:16px;gap:6px}
.top .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;padding:2px 7px;border:2px solid var(--line);border-radius:3px;background:#FFF7E8;white-space:nowrap}
.badge.auto{background:#8FD3FF}
.scrn{width:100%;border:4px solid var(--line);border-radius:6px;background:#2A2A2A;padding:6px;box-shadow:inset 0 0 0 3px #555}
canvas#cv{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;border-radius:2px;touch-action:manipulation}
.msg{min-height:22px;font-weight:900;font-size:15px;text-align:center;color:#3A2A1C}
.meters{width:100%;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:13px;font-weight:900}
.mt{height:12px;background:#FFF7E8;border:2px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
.mt b{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 8px);transition:width .4s}
.acts{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{padding:7px 2px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px}
.acts button span{font-size:22px;line-height:1}
.info{width:100%;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#5A3A2A}

/* modal */
.mod{position:fixed;inset:0;background:rgba(58,42,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod .box{max-width:420px;max-height:90vh;overflow:auto}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:3px solid var(--line);border-radius:4px;font-weight:900;background:#fff;cursor:pointer;user-select:none}
.days input{display:none}
.days label.on{background:#8FD3FF}
.sw{display:flex;align-items:center;gap:8px;font-weight:900;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:#2F7BEA}
.tally{background:#EAF6FF;border:2px dashed #2F7BEA;border-radius:4px;padding:6px 10px;margin-top:8px}
ul.log{margin:6px 0 0;padding-left:20px;font-size:14px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <a class="home" href="../">← 回遊戲屋</a>

  <!-- 選寵物 -->
  <section id="pick" hidden style="width:100%;display:flex;flex-direction:column;gap:12px;align-items:center">
    <h1>點點電子雞</h1>
    <p class="sub">選一隻寵物蛋，把牠養大吧！上班上課的時候可以交給電腦託管。</p>
    <div class="grid20" id="grid"></div>
    <div class="box" id="pickBox" hidden>
      <h3 id="pickTitle"></h3>
      <div id="pickDesc" style="margin-bottom:8px"></div>
      <div class="row"><input type="text" id="pickName" maxlength="8" aria-label="寵物名字"><button class="main" id="pickGo">孵蛋！</button></div>
    </div>
    <button id="pickBack" hidden>回到我的寵物</button>
  </section>

  <!-- 養寵物 -->
  <section id="play" hidden style="width:100%">
    <div class="dev">
      <div class="holes"><i></i><i></i><i></i></div>
      <div class="top"><span class="nm" id="pName"></span><span class="badge" id="pBadge"></span></div>
      <div class="scrn"><canvas id="cv" width="64" height="48"></canvas></div>
      <div class="msg" id="msg"></div>
      <div class="meters" id="meters"></div>
      <div class="info"><span id="pAge"></span><span id="pWt"></span></div>
      <div class="acts" id="acts">
        <button data-a="meal"><span>🍙</span>吃飯</button>
        <button data-a="snack"><span>🍰</span>點心</button>
        <button data-a="game"><span>🎮</span>玩遊戲</button>
        <button data-a="clean"><span>🧽</span>清潔</button>
        <button data-a="med"><span>💊</span>吃藥</button>
        <button data-a="sleep"><span id="slIco">💤</span><i id="slTx" style="font-style:normal">睡覺</i></button>
        <button data-a="auto" class="blue"><span>🤖</span>託管</button>
        <button data-a="swap"><span>🔁</span>換寵物</button>
      </div>
      <div class="acts" id="gameActs" hidden style="grid-template-columns:1fr 1fr">
        <button data-g="-1" class="main" style="font-size:18px"><span>⬅️</span>左邊</button>
        <button data-g="1" class="main" style="font-size:18px"><span>➡️</span>右邊</button>
      </div>
    </div>
  </section>
</main>

<!-- 託管設定 -->
<div class="mod" id="autoMod" hidden>
  <div class="box">
    <h3>🤖 電腦託管</h3>
    <div style="font-size:14px;color:#5A3A2A">託管的時候，電腦會幫你餵飯、陪玩、清便便、餵藥。上班上課時間交給電腦，回家再自己照顧！</div>
    <div style="margin-top:10px"><button class="blue" id="manBtn" style="width:100%"></button></div>
    <div style="margin-top:12px"><label class="sw"><input type="checkbox" id="schOn"> 照時間表自動託管</label></div>
    <div class="days" id="days" style="margin-top:8px"></div>
    <div class="row" style="margin-top:8px;font-weight:900">從 <input type="time" id="tFrom"> 到 <input type="time" id="tTo"></div>
    <div class="tally" id="tally"></div>
    <div class="btns"><button class="main" id="autoClose">好了</button></div>
  </div>
</div>

<!-- 一般訊息 -->
<div class="mod" id="infoMod" hidden>
  <div class="box">
    <h3 id="infoT"></h3>
    <div id="infoB"></div>
    <div class="btns"><button class="main" id="infoOk">好</button></div>
  </div>
</div>

/* ====== 存檔 ====== */
const KEY='pet_save_v1',MIN=60000,HOUR=3600000,DAY=86400000;
const HATCH=30*1000,BABY_T=6*HOUR,MAX_CATCH=30*DAY;
let S;
function newSave(){return {cur:null,pets:{},sched:{on:true,days:[1,2,3,4,5],from:'09:00',to:'17:00'},manual:false}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||typeof S!=='object'||!S.pets)S=newSave();
  if(!S.sched)S.sched=newSave().sched}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cur(){return S.cur==null?null:S.pets[S.cur]}

/* ====== 時間規則 ====== */
const hm=s=>{const[a,b]=String(s).split(':').map(Number);return (a||0)*60+(b||0)};
function inSched(t){const sc=S.sched;if(!sc.on)return false;const d=new Date(t),m=d.getHours()*60+d.getMinutes(),f=hm(sc.from),to=hm(sc.to);
  if(f===to)return false;
  if(f<to)return sc.days.includes(d.getDay())&&m>=f&&m<to;
  // 跨夜：開始那天算
  if(m>=f)return sc.days.includes(d.getDay());
  return m<to&&sc.days.includes((d.getDay()+6)%7)}
const autoOn=t=>S.manual||inSched(t);
function isNight(t){const h=new Date(t).getHours();return h>=21||h<7}
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const clamp=v=>Math.max(0,Math.min(100,v));

function newPet(sp,name,t){return {sp,name,born:t,hatch:t+HATCH,last:t,hunger:80,happy:80,energy:90,health:100,poops:0,pooT:0,sick:false,risk:0,sleep:false,nap:false,weight:5,stage:0,tally:{},log:[],hotel:false}}
function stageOf(p,t){return t<p.hatch?0:t<p.hatch+BABY_T?1:2}
function addLog(p,t,txt){p.log.unshift({t,txt});if(p.log.length>40)p.log.length=40}
function tal(p,t,k){const d=dkey(t);if(!p.tally[d])p.tally={...pickLast(p.tally),[d]:{meal:0,play:0,clean:0,med:0}};p.tally[d][k]++}
function pickLast(o){const ks=Object.keys(o).slice(-6),r={};ks.forEach(k=>r[k]=o[k]);return r}

/* 一分鐘的模擬 */
function step(p,t){
  const st=stageOf(p,t);
  if(st===0)return;
  if(p.stage!==st){p.stage=st;if(st===2)addLog(p,t,p.name+' 長大了！')}
  const h=1/60,night=isNight(t);
  if(night&&!p.sleep){p.sleep=true;p.nap=false}
  if(!night&&p.sleep&&!p.nap)p.sleep=false;
  if(p.nap&&p.energy>=85){p.sleep=false;p.nap=false}
  const k=st===1?1.25:1;   // 寶寶比較快餓
  if(p.sleep){p.hunger-=2.5*h*k;p.happy-=1*h;p.energy+=14*h}
  else{p.hunger-=7*h*k;p.happy-=5*h;p.energy-=5*h;
    p.pooT+=1;if(p.pooT>=(st===1?120:170)){p.pooT=0;if(p.poops<4){p.poops++}}}
  p.happy-=1.5*p.poops*h;
  p.hunger=clamp(p.hunger);p.happy=clamp(p.happy);p.energy=clamp(p.energy);
  if(!p.sleep&&p.energy<=0){p.sleep=true;p.nap=true;addLog(p,t,'累到睡著了')}
  if(!p.sick){
    if(p.poops>=3||p.hunger<=0||p.happy<=0)p.risk+=1;else p.risk=Math.max(0,p.risk-.5);
    if(p.risk>=90){p.sick=true;p.risk=0;addLog(p,t,'生病了 🤒')}
  }
  if(p.sick)p.health-=4*h;
  else if(p.hunger>30&&p.happy>30)p.health+=3*h;
  else if(p.hunger<=0)p.health-=3*h;
  p.health=Math.max(5,Math.min(100,p.health));
  // 電腦託管
  if(autoOn(t)){
    if(p.poops>0){p.poops=0;tal(p,t,'clean')}
    if(p.sick){p.sick=false;p.risk=0;tal(p,t,'med')}
    if(!p.sleep){
      if(p.hunger<50){p.hunger=clamp(p.hunger+30);p.weight+=1;tal(p,t,'meal')}
      if(p.happy<50){p.happy=clamp(p.happy+30);p.weight=Math.max(3,p.weight-1);tal(p,t,'play')}
    }
  }
}
function advance(p,to){
  if(p.hotel)return 0;
  if(to-p.last>MAX_CATCH)p.last=to-MAX_CATCH;
  let n=0;
  while(p.last+MIN<=to){p.last+=MIN;step(p,p.last);n++}
  return n;
}

function colorOf(sp,ch){const c=PETS[sp].c;return c[ch]||PAL[ch]}
function blit(g,rows,x,y,col,flip){
  for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const ch=r[flip?r.length-1-i:i];if(ch==='.')continue;
    g.fillStyle=col(ch);g.fillRect(x+i,y+j,1,1)}}
}
function drawPet(g,sp,x,y,o={}){
  const rows=o.stage===0?EGG:o.stage===1?BABY:PETS[sp].s;
  let col=ch=>colorOf(sp,ch);
  if(o.stage===0)col=ch=>ch==='b'?'#FFFBEA':ch==='a'?PETS[sp].c.b:ch==='d'?'#E8DFC4':PAL[ch];
  let r=rows;
  if(o.blink&&o.stage!==0)r=rows.map(s=>s.replace(/w/g,'b').replace(/e/g,'o'));
  if(o.sleep&&o.stage!==0)r=rows.map((s,j)=>{const t=s.replace(/w/g,'b');return t.includes('e')?t.replace(/e/g,(m,i)=>rows[j+1]&&rows[j+1][i]==='e'?'b':'o'):t});
  if(o.chew&&o.stage===2)r=r.map(s=>s.replace(/oo(?=b)/,'oo'));
  blit(g,r,x,y,col,o.flip);
}
function sheet(){ // 給選寵物畫面用
  return PETS.map((p,i)=>{const c=document.createElement('canvas');c.width=16;c.height=16;drawPet(c.getContext('2d'),i,0,0,{stage:2});return c})
}

const METERS=[['hunger','飽足','#FF9A3C'],['happy','開心','#FF6FA8'],['energy','精神','#5FC8FF'],['health','健康','#5CC45A']];

  b.textContent=a?'🤖 電腦託管中':st===0?'🥚 蛋':p.sleep?'💤 睡覺中':st===1?'寶寶':'成年';

/* ====== 動作 ====== */
let ac;function beep(f=660,d=.08,type='square',v=.05){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gg=ac.createGain();o.type=type;o.frequency.value=f;gg.gain.value=v;o.connect(gg);gg.connect(ac.destination);o.start();gg.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const tune=fs=>fs.forEach((f,i)=>setTimeout(()=>beep(f,.09),i*100));
function act(k){
  const p=cur();if(!p)return;const t=Date.now(),st=stageOf(p,t);
  if(k==='auto')return openAuto();
  if(k==='swap')return showPick();
  if(anim||game)return;
  if(st===0){say('還是一顆蛋，等牠孵出來！');return}
  if(p.sleep&&!['clean','med','sleep'].includes(k)){say('噓～牠在睡覺');beep(300);return}
  if(k==='meal'){if(p.hunger>=95){anim={k:'no',t0:performance.now()};say('吃不下了！');beep(300);return}
    p.hunger=clamp(p.hunger+25);p.weight+=1;anim={k:'meal',t0:performance.now()};say('好好吃！');tune([523,659,784])}
  else if(k==='snack'){if(p.hunger>=98){anim={k:'no',t0:performance.now()};say('吃不下了！');beep(300);return}
    p.hunger=clamp(p.hunger+8);p.happy=clamp(p.happy+15);p.weight+=2;anim={k:'snack',t0:performance.now()};say('是甜點耶！');tune([659,784,1047])}
  else if(k==='clean'){if(!p.poops){say('已經很乾淨了');beep(400);return}
    p.poops=0;p.risk=Math.max(0,p.risk-30);p.happy=clamp(p.happy+5);anim={k:'clean',t0:performance.now()};say('乾乾淨淨！');tune([784,988])}
  else if(k==='med'){if(!p.sick){anim={k:'no',t0:performance.now()};say('沒生病不用吃藥');beep(300);return}
    p.sick=false;p.risk=0;anim={k:'med',t0:performance.now()};say('病好了！');tune([523,784,1047])}
  else if(k==='sleep'){
    if(p.sleep){if(isNight(t)){say('現在是晚上，要好好睡覺');beep(300);return}p.sleep=false;p.nap=false;say('起床囉！');tune([523,659])}
    else{if(p.energy>=85){say('還不睏！');beep(300);return}p.sleep=true;p.nap=true;say('呼呼…');tune([392,330])}}
  else if(k==='game'){if(p.energy<10){say('太累了，先睡一下');beep(300);return}startGame()}
  save();ui();
}
function startGame(){game={round:0,win:0,look:0,res:0};$('acts').hidden=true;$('gameActs').hidden=false;say('牠會往哪邊看？猜猜看！（1/5）',9e9)}
function guess(dir){
  if(!game||game.look)return;
  const look=Math.random()<.5?-1:1,ok=look===dir;
  game.look=look;game.res=ok?1:-1;if(ok)game.win++;
  ok?tune([659,880]):beep(220,.2);
  say(ok?'猜對了！':'猜錯了～',9e9);
  setTimeout(()=>{if(!game)return;game.round++;game.look=0;game.res=0;
    if(game.round>=5){const p=cur(),w=game.win;game=null;$('acts').hidden=false;$('gameActs').hidden=true;
      p.happy=clamp(p.happy+(w>=3?35:15));p.energy=clamp(p.energy-8);p.weight=Math.max(3,p.weight-1);
      anim={k:'happy',t0:performance.now()};say(w>=3?`贏了！猜對 ${w} 次，超開心！`:`猜對 ${w} 次，下次加油！`,4000);if(w>=3)tune([523,659,784,1047]);save();ui()}
    else say(`牠會往哪邊看？猜猜看！（${game.round+1}/5）`,9e9)},1100);
}

function readAuto(){
  const sc=S.sched;sc.on=$('schOn').checked;sc.from=$('tFrom').value||'09:00';sc.to=$('tTo').value||'17:00';
  sc.days=[...$('days').querySelectorAll('input')].filter(i=>i.checked).map(i=>+i.value);
  $('days').querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
  save();refreshAuto();ui();
}
$('days').addEventListener('change',readAuto);
['schOn','tFrom','tTo'].forEach(id=>$(id).addEventListener('change',readAuto));
$('manBtn').onclick=()=>{S.manual=!S.manual;const p=cur();if(p)addLog(p,Date.now(),S.manual?'交給電腦託管':'結束託管');save();refreshAuto();ui();beep(S.manual?880:440)};
$('autoClose').onclick=()=>{$('autoMod').hidden=true};

/* ====== 選寵物 ====== */
let pickI=-1;
function showPick(){
  const p=cur();
  $('play').hidden=true;$('pick').hidden=false;$('pickBox').hidden=true;pickI=-1;
  $('pickBack').hidden=!p;
  const sh=sheet();$('grid').innerHTML='';
  PETS.forEach((d,i)=>{const b=document.createElement('button');b.className='pk';b.append(sh[i]);
    const s=document.createElement('span');s.textContent=d.n;b.append(s);
    const own=S.pets[i];if(own){const tg=document.createElement('span');tg.className='tag'+(S.cur===i?' now':'');tg.textContent=S.cur===i?'養育中':'旅館';b.append(tg)}
    b.onclick=()=>choose(i);$('grid').append(b)});
}
function choose(i){
  pickI=i;[...$('grid').children].forEach((b,j)=>b.classList.toggle('on',j===i));
  const own=S.pets[i],d=PETS[i];
  $('pickBox').hidden=false;$('pickTitle').textContent=d.n;
  if(own){$('pickDesc').textContent=S.cur===i?`${own.name}正在你身邊。`:`${own.name}住在寵物旅館，旅館裡時間是暫停的。接回來繼續養吧！`;$('pickName').value=own.name;$('pickName').disabled=true;$('pickGo').textContent=S.cur===i?'回去':'接回來'}
  else{$('pickDesc').textContent=d.d+(S.cur!=null?' 現在養的寵物會先住進寵物旅館（時間暫停），隨時可以接回來。':'');$('pickName').value=d.n;$('pickName').disabled=false;$('pickGo').textContent='孵蛋！'}
  beep(700);
  $('pickBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('pickGo').onclick=()=>{
  if(pickI<0)return;const t=Date.now();
  const old=cur();if(old&&S.cur!==pickI){advance(old,t);old.hotel=true}
  if(!S.pets[pickI])S.pets[pickI]=newPet(pickI,($('pickName').value.trim()||PETS[pickI].n).slice(0,8),t);
  const p=S.pets[pickI];if(p.hotel){p.hotel=false;p.last=t}
  S.cur=pickI;save();tune([523,659,784]);showPlay();
};
$('pickBack').onclick=()=>showPlay();
function showPlay(){$('pick').hidden=true;$('play').hidden=false;walk.x=24;ui()}

/* ====== 不在的時候 ====== */
function catchUp(showSummary){
  const p=cur();if(!p)return;const t=Date.now(),gap=t-p.last;
  if(gap<MIN)return;
  const before={...p,tally:JSON.parse(JSON.stringify(p.tally))};
  advance(p,t);save();
  if(!showSummary||gap<20*MIN||stageOf(before,before.last)===0)return;
  const sum={meal:0,play:0,clean:0,med:0};
  for(const d in p.tally){const a=p.tally[d],b=before.tally[d]||{};for(const k in sum)sum[k]+=a[k]-(b[k]||0)}
  const hrs=Math.floor(gap/HOUR),mins=Math.floor(gap%HOUR/MIN);
  const any=sum.meal+sum.play+sum.clean+sum.med;
  let html=`<p>你離開了 ${hrs?hrs+' 小時 ':''}${mins} 分鐘。</p>`;
  if(any)html+=`<div class="tally">🤖 電腦託管幫忙：吃飯 ${sum.meal} 次、陪玩 ${sum.play} 次、清便便 ${sum.clean} 次、吃藥 ${sum.med} 次</div>`;
  const bad=[];if(p.hunger<25)bad.push('肚子很餓');if(p.happy<25)bad.push('有點寂寞');if(p.poops)bad.push(`有 ${p.poops} 坨便便`);if(p.sick)bad.push('生病了');
  html+=bad.length?`<p>${p.name}現在${bad.join('、')}，快去照顧牠！</p>`:`<p>${p.name}過得很好 😊</p>`;
  if(!any&&gap>3*HOUR)html+='<p style="font-size:14px;color:#8A6E52">上班上課的時候可以按「🤖 託管」交給電腦照顧喔。</p>';
  info('歡迎回來！',html);
}
function info(t,h){$('infoT').textContent=t;$('infoB').innerHTML=h;$('infoMod').hidden=false}
$('infoOk').onclick=()=>{$('infoMod').hidden=true};

/* ====== 主迴圈 ====== */
$('acts').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a)});
$('gameActs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)guess(+b.dataset.g)});
cv.addEventListener('click',()=>{const p=cur();if(!p||anim||game)return;const st=stageOf(p,Date.now());
  if(st>0&&!p.sleep){anim={k:'happy',t0:performance.now()};p.happy=clamp(p.happy+2);beep(990,.06);save();ui()}});
let lastHatch=-1;
function tick(){
  const p=cur();if(!p||$('play').hidden)return;
  catchUp(false);
  const st=stageOf(p,Date.now());
  const need=st>0&&!p.sleep&&(p.hunger<25||p.happy<25||p.poops>=2||p.sick);
  if(need&&!autoOn(Date.now())&&Date.now()-lastBeep>60000&&!document.hidden){lastBeep=Date.now();tune([880,880,880])}
  ui();
}
function loop(now){render(now);requestAnimationFrame(loop)}
// 寵物會跟著現在時間走，孵蛋只看 hatch 時間，所以每秒檢查一次
setInterval(()=>{const p=cur();if(p&&!$('play').hidden){const s=stageOf(p,Date.now());if(s!==lastHatch){if(lastHatch>=0&&s>lastHatch){say(s===1?'孵出來了！🎉':'長大了！🎉',4000);tune([523,659,784,1047,1319])}lastHatch=s}ui()}},1000);
setInterval(tick,15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else catchUp(true)});
window.addEventListener('pagehide',save);

load();
if(cur()){const p=cur();lastHatch=stageOf(p,Date.now());showPlay();catchUp(true);ui()}else showPick();
requestAnimationFrame(loop);
</script>
</body>
</html>
