<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遊戲屋</title>
<style>
:root{--f:'Microsoft JhengHei','微軟正黑體','PingFang TC','Noto Sans TC',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--f);color:#3B2D52;background:linear-gradient(135deg,#FFF0F7 0 50%,#EEF5FF 50% 100%);display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:640px;display:flex;flex-direction:column;gap:20px;text-align:center}
h1{margin:0;font-size:clamp(32px,8vw,48px);font-weight:900;letter-spacing:.06em}
p{margin:0;color:#6B5E80}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#fff;border-radius:24px;padding:26px 20px;font-weight:900;font-size:24px}
a.card small{font-weight:400;font-size:15px;opacity:.95}
a.girl{background:#FF6FA8;box-shadow:0 6px 0 #D9478A}
a.boy{background:#2F7BEA;box-shadow:0 6px 0 #1F5CC0}
a.road{background:#5FA83C;box-shadow:0 6px 0 #3F7F22}
a.honey{background:#E8A21A;box-shadow:0 6px 0 #B87A0A}
a.fight{background:#7B2FD0;box-shadow:0 6px 0 #4E1694}
a.war{background:#2E7D4F;box-shadow:0 6px 0 #1B5534}
a.card:active{transform:translateY(3px)}
a.card:focus-visible{outline:3px solid #3B2D52;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>遊戲屋</h1>
  <p>背單字、拼小路、搶蜂蜜、打格鬥、帶兵打仗，挑一個來玩！</p>
  <div class="pick">
    <a class="card girl" href="girl/">女孩版<small>收集星星女孩的衣服和髮型</small></a>
    <a class="card boy" href="boy/">可愛怪獸大富翁<small>男孩版・孵蛋收集原創怪獸</small></a>
    <a class="card road" href="road/">小熊鋪路趣<small>拼小路、送旗子・可隨機配對</small></a>
    <a class="card honey" href="honey/">小熊搶蜂蜜<small>排好牌、搶蜂蜜罐・可隨機配對</small></a>
    <a class="card fight" href="fight/">黑曜武鬥祭<small>30 位格鬥家 3 對 3・可線上對戰</small></a>
    <a class="card war" href="war/">旗令戰場<small>即時戰略・只能下令不能操兵</small></a>
  </div>
</main>
</body>
</html>
