<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>單字大富翁</title>
<style>
/* Layout: candy-box board game — square 20×20 board, controls under it, idols running along a candy road fixed to the bottom */
:root{
  --bg:#FFF2F8; --dot:#FFD9EA; --paper:#FFFFFF; --ink:#5A2E57; --soft:#93698F;
  --pink:#FF6FA8; --pink2:#FFE0EE; --lav:#9B7BFF; --lav2:#EFE8FF;
  --mint:#2EC4A0; --mint2:#DDF8EF; --sun:#FFC93C; --sun2:#FFF4CC; --sky2:#E2F3FF;
  --line:#F2B9D3; --bad:#EE4F78; --good:#14A57C;
  --f:'Microsoft JhengHei','微軟正黑體','PingFang TC','Noto Sans TC','Heiti TC',system-ui,sans-serif;
  --u:28px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg) radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/22px 22px;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5}
button,input{font-family:var(--f)}
button{font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 130px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--paper);box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset;font-weight:700;min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line) inset}
.btn.pri{background:var(--pink);color:#fff;box-shadow:0 4px 0 #D9478A}
.btn.pri:active{box-shadow:0 1px 0 #D9478A}
.btn.alt{background:var(--lav);color:#fff;box-shadow:0 4px 0 #7457DB}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}

/* ---------- title ---------- */
.hero{background:var(--paper);border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:10px;align-items:center}
.hero h1{font-weight:900;font-size:clamp(34px,9vw,56px);color:var(--pink);letter-spacing:.06em;text-shadow:3px 3px 0 var(--sun2)}
.hero .sub{color:var(--soft);font-size:15px}
.idol-row{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.idol-row .idol{width:clamp(54px,15vw,92px);height:auto}
.panel{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:20px}
.slot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px dashed var(--line);border-radius:16px;padding:10px 12px}
.slot .info{flex:1 1 180px;min-width:0}
.slot .info b{display:block}
.slot .info small{color:var(--soft)}
.slot .acts{display:flex;gap:8px}

/* ---------- setup ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.lab{font-weight:700;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:8px 14px;min-height:44px;font-weight:700}
.chips button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chips.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.chips.lv button{text-align:left;display:flex;flex-direction:column;gap:2px}
.chips.lv small{font-weight:400;font-size:13px;opacity:.85}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.names label{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--paper)}
.names input{border:0;font-size:16px;width:100%;min-width:0;background:transparent;color:var(--ink)}
.dot{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- game top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar .t{flex:1 1 auto;font-weight:700;min-width:0}
.topbar .t small{display:block;font-weight:400;color:var(--soft);font-size:13px}
.btn.dress{background:var(--lav);color:#fff;box-shadow:0 3px 0 #7457DB}

/* ---------- board ---------- */
#boardWrap{width:100%;display:flex;justify-content:center}
#board{width:calc(var(--u)*20);height:calc(var(--u)*20);display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:1px;background:var(--line);border-radius:calc(var(--u)*.6);overflow:hidden;box-shadow:0 6px 0 #E79CC0;user-select:none}
.cell{position:relative;display:grid;place-items:center;background:var(--paper);font-weight:700;font-size:calc(var(--u)*.9);line-height:1;cursor:pointer;overflow:hidden}
.cell.w0{background:var(--pink2)}.cell.w1{background:var(--lav2)}.cell.w2{background:var(--mint2)}.cell.w3{background:var(--sun2)}
.cell .ico{width:88%;height:88%;display:block}
.cell .abc{color:var(--soft);font-size:calc(var(--u)*.8)}
.cell .cn{width:86%;height:86%;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:calc(var(--u)*.95)}
.cell.here{box-shadow:inset 0 0 0 calc(var(--u)*.16) var(--pink)}
.cell .own{position:absolute;top:1px;left:1px;width:calc(var(--u)*.55);height:calc(var(--u)*.55);border-radius:50%;border:2px solid #fff}
.bridge{background:linear-gradient(180deg,#FFD0E4,#FFF1B8 50%,#CFF5E8);display:grid;place-items:center;position:relative}
.bridge::after{content:"";width:22%;height:22%;border-radius:50%;background:#fff;opacity:.9}
.toks{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:flex-end;padding:1px;gap:1px;pointer-events:none}
.tok{width:calc(var(--u)*.75);height:calc(var(--u)*.75);border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px rgba(90,46,87,.4)}
.tok.me{width:calc(var(--u)*.95);height:calc(var(--u)*.95);animation:hop .9s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-18%)}}

.hub{grid-row:2/6;grid-column:2/10;background:radial-gradient(circle at 20% 20%,#fff 0,#FFF6FB 60%,#FFEAF4 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.3);padding:calc(var(--u)*.3);text-align:center}
.hub .logo{font-weight:900;font-size:calc(var(--u)*1.25);color:var(--pink);letter-spacing:.06em;text-shadow:2px 2px 0 var(--sun2);line-height:1.1}
.hub .who{font-size:calc(var(--u)*.6);display:flex;align-items:center;gap:6px;font-weight:700}
.hub .who .dot{width:calc(var(--u)*.6);height:calc(var(--u)*.6)}
.dicerow{display:flex;align-items:center;gap:calc(var(--u)*.5)}
.dice{width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);background:#fff;border-radius:calc(var(--u)*.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--u)*.28);gap:2px;box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset}
.dice i{border-radius:50%;background:transparent;margin:12%}
.dice i.p{background:var(--pink)}
.dice.roll{animation:shake .5s linear}
@keyframes shake{25%{transform:rotate(-14deg)}50%{transform:rotate(12deg) scale(1.08)}75%{transform:rotate(-6deg)}}
#btnRoll{font-size:calc(var(--u)*.62);min-height:calc(var(--u)*1.6);padding:0 calc(var(--u)*.7)}

.gallery{grid-row:7/10;grid-column:2/10;background:linear-gradient(180deg,#F5EFFF,#FFF0F7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.15);padding:calc(var(--u)*.2);cursor:pointer}
.gallery .gt{font-size:calc(var(--u)*.5);color:var(--soft);font-weight:700;white-space:nowrap}
.gallery .gl{display:flex;gap:calc(var(--u)*.2);justify-content:center;width:100%}
.gm{display:flex;flex-direction:column;align-items:center;flex:1 1 0;min-width:0}
.gm .idol{width:calc(var(--u)*2.6);height:calc(var(--u)*3.85)}
.gm.locked .idol{filter:grayscale(.9) opacity(.45)}
.gm .n{font-size:calc(var(--u)*.48);font-weight:700;white-space:nowrap}

#msg{background:var(--paper);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line);min-height:44px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pc{background:var(--paper);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:4px;border:3px solid transparent}
.pc.cur{border-color:var(--pink)}
.pc .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.pc .coins{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pc .coins span{color:var(--sun);text-shadow:0 1px 0 #D69A00}
.pc .mini{display:flex;gap:2px;flex-wrap:wrap;min-height:30px;align-items:center}
.pc .mini .idol{width:30px;height:30px}
.pc small{color:var(--soft)}
.bar{height:8px;border-radius:99px;background:var(--pink2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:99px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(90,46,87,.38);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;z-index:20;overflow-y:auto}
.card{background:var(--paper);border-radius:26px;width:100%;max-width:460px;padding:20px 18px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;position:relative;animation:pop .25s ease-out}
.card.wide{max-width:680px}
@keyframes pop{from{transform:scale(.9);opacity:.4}}
.card h3{font-size:22px;color:var(--pink)}
.card p{margin:0}
.m-art .idol{width:110px;height:auto}
.m-art svg{width:96px;height:96px}
.m-art .idol{height:auto}
.m-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.m-btns .btn{flex:1 1 140px}
.tag{display:inline-block;background:var(--lav2);color:#6A4FC7;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.zh-big{font-size:30px;font-weight:700}
.word{display:inline-flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;vertical-align:middle;font-weight:700}
.word .ch,.word .lt{width:1.7em;height:2em;border-radius:10px;font-size:22px;text-align:center;font-weight:700;display:inline-grid;place-items:center}
.word .ch{background:var(--sun2);color:var(--ink)}
.word .ch.sym{width:auto;background:transparent;padding:0 1px}
.word .lt{border:2px solid var(--lav);background:#fff;color:var(--ink);padding:0;cursor:pointer;transition:transform .1s}
.word .lt.bad{border-color:var(--bad);background:#FFE6EC}
.word .lt.rev{border-color:var(--good);background:#E2F8F0;color:var(--good)}
.word .lt.ok{border-color:var(--good);background:#E2F8F0}
.word .gap{width:.8em}
.word .lt.act{box-shadow:0 0 0 3px var(--pink);transform:translateY(-2px)}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;user-select:none;-webkit-user-select:none}
.kb .r{display:flex;gap:4px;justify-content:center}
.kb button{flex:1 1 0;max-width:44px;min-width:0;height:48px;border-radius:10px;border:0;background:var(--pink2);color:var(--ink);font-size:21px;font-weight:700;box-shadow:0 3px 0 var(--line);padding:0;touch-action:manipulation}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.kb .del{max-width:66px;flex:1.6 1 0;background:var(--lav2)}

.sent{font-size:21px;line-height:2.2;font-weight:500}
.zh-sent{font-size:19px;background:var(--pink2);border-radius:14px;padding:6px 14px}
.qmsg{min-height:1.5em;font-weight:700}
.qmsg.good{color:var(--good)}.qmsg.bad{color:var(--bad)}
.spk{border:0;background:var(--sky2);border-radius:999px;min-height:40px;padding:4px 14px;font-weight:700;color:#2B78B5}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px}
.burst span{position:absolute;bottom:30%;font-size:22px;animation:fly 1.1s ease-out forwards;color:var(--pink)}
@keyframes fly{to{transform:translate(var(--dx),-180px) rotate(200deg);opacity:0}}
.list{width:100%;text-align:left;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.list .li{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:6px 2px}
.list .li b{font-size:18px}
.list .li span{flex:1}
.rules{text-align:left;display:flex;flex-direction:column;gap:6px;font-size:15px}
.rules b{color:var(--pink)}
.rank{width:100%;display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;align-items:center;gap:8px;background:var(--pink2);border-radius:14px;padding:8px 12px;font-weight:700}
.rank div span{flex:1;text-align:left}
.gifts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gift{width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--lav2);border-radius:18px;padding:8px;font-size:13px;font-weight:700}
.gift svg{width:100px;height:100px}

/* ---------- dressing room ---------- */
.dr{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%}
@media (min-width:600px){.dr{grid-template-columns:200px minmax(0,1fr);align-items:start}}
.dr-prev{background:radial-gradient(circle at 50% 35%,#fff 0,var(--pink2) 75%);border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.dr-prev .idol{width:150px;height:auto;max-width:100%}
.dr-prev .nm{font-weight:900;font-size:18px}
.dr-prev .cnt{font-size:13px;color:var(--soft)}
.dr-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;min-height:38px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.tabs.who button{display:flex;align-items:center;gap:4px;padding:2px 10px 2px 4px}
.tabs.who .idol{width:30px;height:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:46vh;overflow-y:auto;padding:2px}
.it{border:2px solid var(--line);background:#fff;border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;line-height:1.25}
.it svg{width:70px;height:70px}
.it.on{border-color:var(--pink);background:var(--pink2);box-shadow:0 0 0 2px var(--pink) inset}
.it.lock{background:#F6F1F5;color:#B7A3B5;cursor:default}
.it.lock .q{width:70px;height:70px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#D8C6D6}
.it .wearing{color:var(--pink)}

/* ---------- collection book ---------- */
.bk-top{width:100%;display:flex;flex-direction:column;gap:6px}
.bk-top .big{font-weight:900;font-size:20px;color:var(--ink)}
.bk-list{width:100%;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;text-align:left;padding:2px}
.bk-sec h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.bk-sec h4 small{color:var(--soft);font-weight:400}
.bk-sec h4 .bar{flex:1;max-width:160px}
.it.lock svg{filter:brightness(0) opacity(.16)}
.bk-note{background:var(--sun2);border-radius:14px;padding:6px 12px;font-size:14px}
.tabs .cnt{font-size:12px;opacity:.8}
.lvt{display:inline-block;color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;line-height:1.6;white-space:nowrap}
.lvsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;width:100%}
.lvsum div{background:var(--lav2);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
.lvsum div.on{box-shadow:0 0 0 2px var(--pink) inset;background:var(--pink2)}
.lvpick{display:flex;flex-direction:column;gap:8px;width:100%}
.lvpick button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;font-weight:700}
.lvpick button.on{border-color:var(--pink);background:var(--pink2)}
.lvpick small{font-weight:400;color:var(--soft)}

/* ---------- running idols ---------- */
#runbar{position:fixed;left:0;right:0;bottom:0;height:calc(118px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5;overflow:hidden}
#runbar .road{position:absolute;left:0;right:0;bottom:0;height:calc(30px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(255,224,238,0),#FFD0E4 60%);}
#runbar .road::before{content:"";position:absolute;left:0;right:0;top:16px;height:5px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 34px);opacity:.9}
.runner{position:absolute;left:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:52px;animation:runX var(--d) linear var(--dl) infinite alternate}
@keyframes runX{from{transform:translateX(-6px)}to{transform:translateX(calc(100vw - 50px))}}
.runner .flip{animation:flip calc(var(--d) * 2) linear var(--dl) infinite}
@keyframes flip{0%,49.99%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
.runner .bob{animation:bob .34s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-8px) rotate(6deg)}}
.runner .idol{width:52px;height:78px;display:block}
.runner .shadow{width:34px;height:6px;margin:-4px auto 0;border-radius:50%;background:rgba(200,90,150,.25)}
.bub{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:3px 9px;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 var(--line);font-weight:700;color:var(--ink);animation:pop .25s ease-out}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}

#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.runner{left:calc(var(--k) * 19% + 2%)}}

#musicBtn{position:fixed;right:16px;bottom:calc(126px + env(safe-area-inset-bottom,0px));z-index:6;width:48px;height:48px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset;font-size:22px;font-weight:900;color:var(--pink);display:grid;place-items:center}
#musicBtn.off{color:var(--soft);opacity:.75}
#musicBtn.off::after{content:"";position:absolute;width:30px;height:3px;background:var(--soft);border-radius:2px;transform:rotate(-45deg)}

/* ---------- themed maps ---------- */
#board.world{display:block;position:relative;padding:0;gap:0;background:var(--paper);border-radius:calc(var(--u)*1.2)}
#board.world .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#board.world .cell{position:absolute;width:8.2%;height:8.2%;border-radius:30%;background:var(--tile);box-shadow:0 2px 0 var(--edge),0 0 0 1.5px var(--edge) inset;overflow:visible}
#board.world .cell.w0{background:#FFF1F6}#board.world .cell.w1{background:#F4EFFF}#board.world .cell.w2{background:#EEFBF5}#board.world .cell.w3{background:#FFF9E6}
#board.world .cell .ico{width:84%;height:84%}
#board.world .cell.here{box-shadow:0 0 0 calc(var(--u)*.16) #fff,0 0 0 calc(var(--u)*.3) var(--pink)}
#board.world .cell .toks{inset:-12%}
#board.world .tok{border:3px solid #fff;box-shadow:0 2px 4px rgba(90,46,87,.5);background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 22%,transparent 24%)}
#board.world .tok.me{width:calc(var(--u)*1.05);height:calc(var(--u)*1.05)}
#board.world .sc{position:absolute;width:4%;height:4%;transform:translate(-50%,-50%);border-radius:50%}
#board.world .sc .toks{position:absolute;inset:-60%;display:grid;place-items:center;padding:0}

 const bg=`<rect width="8" height="8" fill="${base}"/>`;
 const body={
  stripe:`<rect width="8" height="2.6" fill="${pc}" opacity=".7"/><rect y="4" width="8" height="2.6" fill="${pc}" opacity=".7"/>`,
  dot:`<circle cx="2" cy="2" r="1.1" fill="${pc}"/><circle cx="6" cy="6" r="1.1" fill="${pc}"/>`,

  star:STARP(4,4,2.4,pc)
 }[type]||'';
 return `<pattern id="${id}" width="8" height="8" patternUnits="userSpaceOnUse">${bg}${body}</pattern>`;
}
function drawItem(sp,ctx){

 return out;
}

   if(!nx)break;seen.add(nx.join());sc.push(nx);p=nx;

   ${cab.map((c,k)=>{const a=k*Math.PI/4;const x=(50+24*Math.cos(a)).toFixed(1),y=(50+24*Math.sin(a)).toFixed(1);return `<path d="M50 50 L${x} ${y}" stroke="#fff" stroke-width=".8"/><rect x="${x-2.6}" y="${+y}" width="5.2" height="4.4" rx="1.4" fill="${c}"/>`}).join('')}<circle cx="50" cy="50" r="2.4" fill="#FF6FA8"/>`}
 }
}
function sceneSVG(m,uid,opt={}){
 const z=m.idol,pts=m.path.map(p=>ctr(p).join(',')).join(' ');
 let dec='';
 m.empty.forEach(([r,c])=>{const h=hash(r,c,z);if(h%100<58){const kind=DECOR[z][h%4],[x,y]=ctr([r,c]);dec+=D[kind](x+((h>>4)%5-2)*.6,y+((h>>7)%5-2)*.6)}});
 const sc=[m.path[m.gA],...m.sc,m.path[m.gB]].map(p=>ctr(p).join(',')).join(' ');
 const dots=opt.dots?m.path.map((p,i)=>{const[x,y]=ctr(p);return `<circle cx="${x}" cy="${y}" r="${i===0?3:2.2}" fill="${i===0?'#FF6FA8':'#fff'}" stroke="${m.edge}" stroke-width=".6"/>`}).join(''):'';
 return `<defs><linearGradient id="bg${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m.bg[0]}"/><stop offset="1" stop-color="${m.bg[1]}"/></linearGradient></defs>
 <rect width="100" height="100" fill="url(#bg${uid})"/>${centerpiece(z)}${dec}
 <polyline points="${sc}" fill="none" stroke="${m.edge}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>
 <polyline points="${sc}" fill="none" stroke="${m.shortC}" stroke-width="3.8" stroke-dasharray="3 1.5" stroke-linecap="round" stroke-linejoin="round"/>
 <polygon points="${pts}" fill="none" stroke="${m.edge}" stroke-width="8.6" stroke-linejoin="round" opacity=".55"/>
 <polygon points="${pts}" fill="none" stroke="${m.road}" stroke-width="6.6" stroke-linejoin="round"/>${dots}`;
}

const KEY='wordMonopoly.v1.slot';
const memStore={};
function readSlot(n){let g=null;try{const s=localStorage.getItem(KEY+n);if(s)g=JSON.parse(s)}catch(e){}g=g||memStore[n]||null;return g?migrate(g):null}
function writeSlot(n,g){memStore[n]=JSON.parse(JSON.stringify(g));try{localStorage.setItem(KEY+n,JSON.stringify(g));return true}catch(e){return false}}
function delSlot(n){delete memStore[n];try{localStorage.removeItem(KEY+n)}catch(e){}}
function newPlayer(name,k){return{name,color:PCOLORS[k],pos:0,coins:START,right:0,wrong:0,bridge:null,idols:[false,false,false,false,false],pass:[true,false,false,false,false],map:HOME_MAP,items:[],wear:IDOLS.map(()=>({}))}}
function migrate(g){
 g.players.forEach((p,k)=>{
  if(!p.idols)p.idols=IDOLS.map((_,i)=>!!(g.idolOwner&&g.idolOwner[i]===k));
  if(!p.items)p.items=[];
  if(!p.wear)p.wear=IDOLS.map(()=>({}));
 });
 delete g.idolOwner;delete g.houseOwner;
 if((g.v||1)<2&&g.over)g.over=false;
 g.v=2;return g;
}

   const w=nextWord();const ok=await quiz(w);

   break}
  case 'idol':await onIdol(p,m.idol);break;

 if(!p.idols[id]){

  const v=await choice({art:idolSVG(id),title:`${d.name} ${d.en}`,body:`${d.role}<br>${can?`花 <b>${IDOL_PRICE}</b> 星星幣邀請她加入你的團吧！`:`還差 <b>${IDOL_PRICE-p.coins}</b> 星星幣才能邀請她喔`}`,btns:[{t:`收集 ${d.name}`,v:'buy',cls:'pri',dis:!can},{t:'下次再說',v:'no'}]});

/* ---------- 單字題（畫面上的字母鍵盤，不會跳出系統鍵盤） ---------- */
let quizKeyHandler=null;
function quiz(w){
 const lv=G.level,chars=[...w.en];
 const letters=chars.map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);
 let hide;
 if(lv>=2)hide=new Set(letters);
 else{const k=Math.max(1,Math.ceil(letters.length*(lv===0?1/3:1/2)));hide=new Set(shuffle(letters.slice()).slice(0,k))}
 const slots=[...hide].sort((a,b)=>a-b);
 const boxes=chars.map((c,i)=>c===' '?'<span class="gap"></span>':hide.has(i)?`<button type="button" class="lt" data-i="${i}" aria-label="第${i+1}個字母"></button>`:`<span class="ch${/[a-z]/i.test(c)?'':' sym'}">${esc(c)}</span>`).join('');
 const wordHtml=`<span class="word">${boxes}</span>`;
 let prompt,sentence=w.en;
 if(lv===3){
  const tpl=pick(T[w.tag]||T.x),art=/^[aeiou]/i.test(w.en)?'an':'a';
  const en=tpl[0].replace('{a}',art),zh=tpl[1].replace('{z}',zFirst(w.zh)).replace('{y}',yForm(w.zh));
  const[l,r]=en.split('___');sentence=en.replace('___',w.en);
  prompt=`<div class="sent">${esc(l)}${wordHtml}${esc(r)}</div><div class="zh-sent">${esc(zh)}</div>`;
 }else prompt=`<div class="zh-big">${esc(w.zh)}</div><div>${wordHtml}</div>`;
 const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
 const kb=`<div class="kb" id="kb">${rows.map((r,ri)=>`<div class="r">${[...r].map(ch=>`<button type="button" data-key="${ch}">${ch}</button>`).join('')}${ri===2?'<button type="button" class="del" data-key="del" aria-label="刪除">⌫</button>':''}</div>`).join('')}</div>`;
 let tries=lv===0?2:1,done=false;
 const p=cur();
 const promise=openModal(`<span class="tag">${LEVELS[lv]}・答對 +${REWARD[lv]}</span>
  <h3>${esc(p.name)} 的單字挑戰</h3>${prompt}
  <div class="qmsg" id="qmsg">${lv===3?'把句子裡缺的單字拼出來':'把空格的字母填好'}${tries>1?'（有 2 次機會）':''}</div>
  ${kb}
  <div class="m-btns" id="qbtns"><button class="spk" data-speak="${esc(lv===3?sentence:w.en)}">${lv===3?'聽句子':'聽發音'}</button><button class="btn pri" id="qcheck">送出答案</button></div>`);
 const card=$('#modalCard'),msg=$('#qmsg'),vals={};
 const boxEl=i=>card.querySelector(`.lt[data-i="${i}"]`);
 let act=0;
 function paint(){slots.forEach((i,k)=>{const b=boxEl(i);b.textContent=vals[i]||'';b.classList.toggle('act',!done&&k===act)})}
 function type(ch){
  if(done)return;
  if(ch==='del'){
   const i=slots[act];
   if(vals[i])delete vals[i];else if(act>0){act--;delete vals[slots[act]]}
  }else{
   const i=slots[act];vals[i]=ch;boxEl(i).classList.remove('bad');
   const nxt=slots.findIndex((s,k)=>k>act&&!vals[s]);
   if(nxt>=0)act=nxt;else if(act<slots.length-1)act++;
  }
  paint();
 }
 card.querySelectorAll('.lt').forEach(b=>b.addEventListener('click',()=>{if(done)return;act=slots.indexOf(+b.dataset.i);paint()}));
 $('#kb').addEventListener('click',e=>{const k=e.target.closest('[data-key]');if(k)type(k.dataset.key)});
 if(quizKeyHandler)document.removeEventListener('keydown',quizKeyHandler);
 quizKeyHandler=e=>{
  if($('#modal').hidden){document.removeEventListener('keydown',quizKeyHandler);quizKeyHandler=null;return}
  if(/^[a-z]$/i.test(e.key)){e.preventDefault();type(e.key.toLowerCase())}
  else if(e.key==='Backspace'){e.preventDefault();type('del')}
  else if(e.key==='Enter'&&!done){e.preventDefault();check()}
 };
 document.addEventListener('keydown',quizKeyHandler);
 paint();
 function finish(ok){
  done=true;paint();$('#kb').hidden=true;
  $('#qbtns').innerHTML=`<button class="spk" data-speak="${esc(sentence)}">聽發音</button><button class="btn pri" data-v="${ok?'ok':'no'}">${ok?'太棒了':'知道了'}</button>`;
 }
 function check(){
  if(done)return;
  if(slots.some(i=>!vals[i])){msg.className='qmsg bad';msg.textContent='還有空格沒填喔';act=slots.findIndex(i=>!vals[i]);paint();return}
  let ok=true;
  slots.forEach(i=>{if(chars[i].toLowerCase()!==vals[i]){ok=false;boxEl(i).classList.add('bad')}});
  if(ok){
   slots.forEach(i=>boxEl(i).classList.add('ok'));
   msg.className='qmsg good';msg.innerHTML=`答對了！+${REWARD[lv]} 星星幣`;
   const bu=document.createElement('div');bu.className='burst';
   bu.innerHTML=[...Array(10)].map((_,k)=>`<span style="left:${10+k*8}%;--dx:${rnd(80)-40}px;animation-delay:${k*40}ms;color:${['#FF6FA8','#9B7BFF','#FFC93C','#2EC4A0'][k%4]}">${k%2?'★':'♥'}</span>`).join('');
   card.appendChild(bu);speak(w.en);finish(true);
  }else{
   tries--;
   if(tries>0){msg.className='qmsg bad';msg.textContent='差一點點！紅色的格子再試一次';act=slots.findIndex(i=>boxEl(i).classList.contains('bad'));paint();return}
   slots.forEach(i=>{vals[i]=chars[i];const b=boxEl(i);b.classList.remove('bad');b.classList.add('rev')});
   msg.className='qmsg bad';msg.innerHTML=`正確答案是 <b>${esc(w.en)}</b>，已放進錯字本`;
   finish(false);
  }
 }
 $('#qcheck').onclick=check;
 return promise.then(v=>{if(quizKeyHandler){document.removeEventListener('keydown',quizKeyHandler);quizKeyHandler=null}return v==='ok'});
}

 <div><b>五張主題地圖：</b>甜點王國（糖糖）、星空舞台（月月）、陽光海灘（小陽）、花園森林（薄荷）、遊樂園（可可）。按「世界地圖」花 ${PASS_PRICE} 解鎖新地圖，解鎖後可以隨時來回。</div>
 <div><b>Ab 單字格：</b>看中文拼英文，答對就賺錢，還有機會拿到新衣服。小朋友填 1/3、普通人填一半、有一點厲害的人整個字自己拼、超級厲害的人要在英文句子裡填空。</div>
 <div><b>星星女孩：</b>每位團員住在自己的地圖，停在她的格子花 ${IDOL_PRICE} 邀請她加入。她的衣服和髮型只有在她的地圖才拿得到！</div>
 <div><b>衣櫃：</b>收集到團員後，停在她的衣櫃可以花 ${BAG_PRICE} 開福袋，拿到 ${BAG_N} 件新寶物。每位團員有套裝、頭飾、上衣、褲子、裙子、外套、鞋子共 60 件衣服，加上 10 個髮型，五位加起來 300 件衣服和 50 個髮型！</div>
 <div><b>換裝間：</b>隨時按上面的「換裝間」或地圖下方的團員頭像，就能幫她換衣服和髮型。</div>
 <div><b>捷徑：</b>每張地圖都有一條捷徑（彩虹糖橋、流星滑梯、香蕉船、藤蔓鞦韆、雲霄飛車），<u>剛好停在捷徑入口</u>才可以選擇要不要走。</div>
 <div><b>景點和幸運星：</b>每張地圖有三個特色景點，停上去會有驚喜！</div>
 <div><b>關卡收集：</b>衣服和髮型平均分給四個關卡，每個關卡只能拿到自己那一份。按「換關卡」可以隨時切換，四個關卡都要玩才能全部收齊！</div>
 <div><b>目標：</b>全部 ${TOTAL} 件收齊就是造型大師！</div>
 <div><b>存檔：</b>每走完一回合會自動存檔，在主選單可以繼續玩。</div></div>
 <div class="m-btns"><button class="btn pri" data-v="ok">知道了</button></div>`}
function missedHtml(){
 const m=G?G.missed:[];
 return `<h3>錯字本</h3>${m.length?`<div class="list">${m.map(w=>`<div class="li"><b>${esc(w.en)}</b><span>${esc(w.zh)}</span><button class="spk" data-speak="${esc(w.en)}">聽</button></div>`).join('')}</div>`:'<p>目前沒有錯字，好厲害！</p>'}<div class="m-btns"><button class="btn pri" data-v="ok">關閉</button></div>`;
}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;
 const act=a.dataset.act;
 if(act==='rules'&&!modalResolve)openModal(rulesHtml());
 if(act==='missed'&&!modalResolve)openModal(missedHtml());
 if(act==='world'){if(busy||modalResolve){toast('等這一步走完再換地圖喔');return}openWorld()}
 if(act==='dress'){if(busy||modalResolve){toast('等這一步走完再換裝喔');return}openDress(G.cur)}
 if(act==='book'){if(busy||modalResolve){toast('等這一步走完再看收集冊喔');return}openBook()}
 if(act==='level'){if(busy||modalResolve){toast('等這一步走完再換關卡喔');return}openLevel()}
 if(act==='save')save(false);
 if(act==='home'){if(busy){toast('等這一步走完再回主選單喔');return}if(G)save(true);renderSlots();show('scrTitle')}
});
function allDone(p){
 return openModal(`<div class="idol-row">${IDOLS.map((_,i)=>idolSVG(i,p.wear[i])).join('')}</div>
 <h3>${esc(p.name)} 是造型大師！</h3>
 <p>300 件衣服和 50 個髮型全部收齊了，總共答對 ${p.right} 題，第 ${G.round} 回合完成！<br>可以繼續玩，幫大家搭配新造型。</p>
 <div class="m-btns"><button class="btn pri" data-v="ok">太棒了</button></div>`);

/* ---------- 背景音樂：閃亮魔法少女風（原創旋律，瀏覽器即時合成） ---------- */
const BGM=(function(){
 const KEY='wordMonopoly.music',STEP=.2;
 const _=null;
 const A=[[81,_,79,81,84,_,81,79],[79,_,77,79,83,_,79,77],[76,79,83,79,84,83,79,76],[81,_,_,79,81,_,84,_],
          [84,_,81,84,89,_,88,86],[86,_,83,86,88,86,83,79],[84,83,84,86,88,_,84,_],[84,_,_,_,79,81,83,_]];
 const AC=[[65,69,72],[67,71,74],[64,67,71],[69,72,76],[65,69,72],[67,71,74],[64,67,72],[64,67,72]];
 const AR=[53,55,52,45,53,55,48,48];
 const B=[[81,81,81,_,77,_,81,_],[83,83,83,_,79,_,86,_],[88,_,86,84,83,_,84,_],[81,_,76,_,81,83,84,_],
          [86,_,84,_,81,_,77,79],[81,_,83,_,86,_,83,_],[84,_,88,_,91,_,88,_],[84,_,_,_,_,_,_,_]];
 const BC=[[62,65,69],[67,71,74],[64,67,72],[69,72,76],[62,65,69],[67,71,74],[64,67,72],[64,67,72]];
 const BR=[50,55,48,45,50,55,48,48];
 const SONG=[[A,AC,AR],[B,BC,BR],[A,AC,AR],[B,BC,BR]];
 let ac=null,master=null,noise=null,timer=null,next=0,step=0,on=true;
 try{on=localStorage.getItem(KEY)!=='off'}catch(e){}
 const hz=m=>440*Math.pow(2,(m-69)/12);
 function tone(t,m,dur,type,vol,att){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
 }
 function bell(t,m,dur){tone(t,m,dur,'triangle',.07);tone(t,m+12,dur*.6,'sine',.03);tone(t,m+24,dur*.3,'sine',.012)}
 function hit(t,dur,vol,freq,type){
  const s=ac.createBufferSource();s.buffer=noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);
 }
 function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(master);o.start(t);o.stop(t+.16)}
 function sparkle(t){[84,88,91,96,100,103].forEach((m,k)=>tone(t+k*.035,m,.25,'sine',.025))}
 function play(t){
  const sec=Math.floor(step/64)%SONG.length,bar=Math.floor(step/8)%8,s=step%8;
  const [mel,chords,roots]=SONG[sec],note=mel[bar][s],ch=chords[bar],root=roots[bar];
  if(bar===0&&s===0)sparkle(t);
  if(s===0||s===3||s===4)tone(t,root,STEP*1.4,'triangle',.13,.01);
  if(s===6)tone(t,root+7,STEP*1.2,'triangle',.11,.01);
  if(s===2||s===6)ch.forEach(m=>tone(t,m,STEP*.9,'triangle',.022,.01));
  tone(t,ch[s%3]+24,.12,'sine',.01);
  if(note!=null){const nx=s<7?mel[bar][s+1]:null;bell(t,note,nx==null?.55:.32)}
  if(s===0||s===4)kick(t);
  if(s===2||s===6)hit(t,.08,.07,1500,'bandpass');
  hit(t,.03,.018,8000,'highpass');
  step++;
 }
 function tick(){if(!ac)return;while(next<ac.currentTime+.3){play(next);next+=STEP}}
 function start(){
  try{
   if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=.5;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;
    const dl=ac.createDelay();dl.delayTime.value=.3;const fb=ac.createGain();fb.gain.value=.22;const wet=ac.createGain();wet.gain.value=.22;
    master.connect(lp);lp.connect(ac.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
    noise=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   }
   ac.resume();next=ac.currentTime+.1;
   if(!timer)timer=setInterval(tick,60);
  }catch(e){}
 }
 function stop(){clearInterval(timer);timer=null;try{ac&&ac.suspend()}catch(e){}}
 function paint(){const b=document.getElementById('musicBtn');if(b){b.classList.toggle('off',!on);b.setAttribute('aria-label',on?'關掉音樂':'打開音樂');b.title=on?'關掉音樂':'打開音樂'}}
 function toggle(){if(on&&!timer){start();paint();return}on=!on;try{localStorage.setItem(KEY,on?'on':'off')}catch(e){}on?start():stop();paint()}
 const first=e=>{document.removeEventListener('pointerdown',first,true);if(e.target.closest&&e.target.closest('#musicBtn'))return;if(on&&!timer)start()};
 document.addEventListener('pointerdown',first,true);
 document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(on&&timer)ac.resume()});
 document.getElementById('musicBtn').addEventListener('click',e=>{e.stopPropagation();toggle()});
 paint();
 function duck(d){try{if(master&&ac)master.gain.setTargetAtTime(d?.1:.5,ac.currentTime,.08)}catch(e){}}
 return{toggle,duck};
})();
</script>
